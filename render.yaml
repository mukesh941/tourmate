services:
  - type: web
    name: tourmate-backend
    env: python
    region: oregon
    plan: free
    rootDir: tourmate-ai/backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: MONGO_URI
        sync: false
      - key: MONGO_DB_NAME
        value: tourmate
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256
      - key: JWT_ACCESS_TOKEN_EXPIRE_MINUTES
        value: 60
      - key: JWT_REFRESH_TOKEN_EXPIRE_DAYS
        value: 7
      - key: CORS_ORIGINS
        value: https://frontend-delta-six-hf0z79dpo8.vercel.app,https://tourmate-ai.netlify.app,https://tourmate.vercel.app,http://localhost:5173
      - key: GEMINI_API_KEY
        sync: false
