version: "3.9"

services:
  mongo:
    image: mongo:6
    container_name: tourmate-mongo
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: tourmate
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: tourmate-backend
    ports:
      - "8000:8000"
    environment:
      MONGO_URI: mongodb://mongo:27017
      MONGO_DB_NAME: tourmate
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-change-me-super-secret}
      JWT_ALGORITHM: HS256
      JWT_ACCESS_TOKEN_EXPIRE_MINUTES: 60
      JWT_REFRESH_TOKEN_EXPIRE_DAYS: 7
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
    depends_on:
      mongo:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - tourmate

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: tourmate-frontend
    ports:
      - "5173:5173"
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000/api}
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - tourmate

volumes:
  mongo_data:
    driver: local

networks:
  tourmate:
    driver: bridge
