services:
  # Backend API Service
  - type: web
    name: tourmate-api
    env: python
    rootDir: backend
    buildCommand: "pip install -r requirements.txt && alembic upgrade head"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: tourmate-postgres
          property: connectionString
      - key: MONGO_URI
        sync: false
      - key: MONGO_DB_NAME
        value: tourmate
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256
      - key: JWT_ACCESS_TOKEN_EXPIRE_MINUTES
        value: 60
      - key: JWT_REFRESH_TOKEN_EXPIRE_DAYS
        value: 7
      - key: CORS_ORIGINS
        value: "https://tourmate-ai.netlify.app,https://tourmate.vercel.app,http://localhost:5173"
      - key: GEMINI_API_KEY
        sync: false
      - key: PYTHON_VERSION
        value: 3.11.9

databases:
  # Managed PostgreSQL with pgvector support
  - name: tourmate-postgres
    databaseName: tourmate
    user: tourmate_user
    plan: standard
    postgresMajorVersion: 16
